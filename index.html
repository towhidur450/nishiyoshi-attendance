<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishiyoshi 出勤簿</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { color: #333; text-align: center; }
        form { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label, input, button { display: block; width: 100%; margin-bottom: 10px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px; cursor: pointer; }
        button:hover { background: #45a049; }
        .action-buttons { display: flex; justify-content: space-between; }
        .action-buttons button { width: 48%; }
        .report-buttons { display: flex; justify-content: space-between; max-width: 400px; margin: 20px auto; }
        .report-buttons button { width: 48%; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f2f2f2; }
        #loginSection { display: block; }
        #signupSection { display: none; }
        #userSection { display: none; }
        #employeeSection { display: none; }
        #adminSection { display: none; }
        #logoutBtn { max-width: 200px; margin: 20px auto; display: block; background: #f44336; }
        #logoutBtn:hover { background: #d32f2f; }
        #changePasswordForm { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .login-options { display: flex; justify-content: space-between; max-width: 400px; margin: 20px auto; }
        .login-options button { width: 48%; }
        .month-selector { display: flex; justify-content: space-between; max-width: 400px; margin: 20px auto; }
        .month-selector select { width: 48%; }
        .navbar { background-color: #333; color: white; padding: 10px; display: flex; justify-content: space-between; align-items: center; }
        .navbar .logo { font-size: 24px; font-weight: bold; }
        .navbar .nav-buttons { display: flex; gap: 10px; }
        .navbar button { background: #555; color: white; border: none; padding: 8px 16px; cursor: pointer; }
        .navbar button:hover { background: #d91313; }
    </style>
</head>
<body>
    <!-- ナビゲーションバー -->
    <div class="navbar">
        <div class="logo">
            Nishiyoshi 出勤簿
        </div>
        <div class="nav-buttons">
            <button id="navLoginBtn">ログイン</button>
            <button id="navSignupBtn">サインアップ</button>
        </div>
    </div>

    <h1>Nishiyoshi 出勤簿</h1>
    
    <!-- ログインセクション -->
    <div id="loginSection">
        <form id="loginForm" style="display: none;">
            <label for="loginId">ID:</label>
            <input type="text" id="loginId" required>
            <label for="loginPassword">パスワード:</label>
            <input type="password" id="loginPassword" required>
            <button type="submit">ログイン</button>
        </form>
        
        <!-- チェックイン/チェックアウトボタン (ゲスト用) -->
        <form id="attendanceForm">
            <label for="name">従業員名:</label>
            <input type="text" id="name" required>
            
            <div class="action-buttons">
                <button type="submit" id="checkInBtn">チェックイン</button>
                <button type="submit" id="checkOutBtn">チェックアウト</button>
            </div>
        </form>
    </div>
    
   <!-- サインアップセクション -->
    <div id="signupSection">
        <form id="signupForm">
            <label for="signupId">ID:</label>
            <input type="text" id="signupId" required>
            <label for="signupPassword">パスワード:</label>
            <input type="password" id="signupPassword" required>
            <label for="role">ロール:</label>
            <select id="role" required>
                <option value="employee">従業員</option>
                <option value="admin">管理者</option>
            </select>
            <button type="submit">サインアップ</button>
            <button type="button" id="backToLogin">戻る</button>
        </form>
    </div>
    
    <!-- 一般ユーザーセクション -->
    <div id="userSection">
        <form id="userAttendanceForm">
            <label for="userName">従業員名:</label>
            <input type="text" id="userName" required>
            
            <div class="action-buttons">
                <button type="submit" id="userCheckInBtn">チェックイン</button>
                <button type="submit" id="userCheckOutBtn">チェックアウト</button>
            </div>
        </form>
        
        <button id="logoutBtn">ログアウト</button>
    </div>
    
    <!-- 従業員セクション -->
    <div id="employeeSection">
        <h2>あなたの出勤ログ</h2>
        <table id="employeeLogTable">
            <thead>
                <tr>
                    <th>アクション</th>
                    <th>タイムスタンプ</th>
                    <th>場所</th>
                </tr>
            </thead>
            <tbody id="employeeLogBody">
            </tbody>
        </table>
        
        <div class="month-selector">
            <select id="employeeYear">
            </select>
            <select id="employeeMonth">
                <option value="0">1 月</option>
                <option value="1">2 月</option>
                <option value="2">3 月</option>
                <option value="3">4 月</option>
                <option value="4">5 月</option>
                <option value="5">6 月</option>
                <option value="6">7 月</option>
                <option value="7">8 月</option>
                <option value="8">9 月</option>
                <option value="9">10 月</option>
                <option value="10">11 月</option>
                <option value="11">12 月</option>
            </select>
        </div>
        <button id="employeeDownloadBtn">自分の月次レポートをダウンロード (CSV)</button>
        <button id="logoutBtn">ログアウト</button>
    </div>
    
    <!-- 管理者セクション -->
    <div id="adminSection">
        <h2>出勤ログ</h2>
        <table id="logTable">
            <thead>
                <tr>
                    <th>名前</th>
                    <th>アクション</th>
                    <th>タイムスタンプ</th>
                    <th>場所</th>
                </tr>
            </thead>
            <tbody id="logBody">
            </tbody>
        </table>
        
        <div class="month-selector">
            <select id="adminYear">
            </select>
            <select id="adminMonth">
                <option value="0">1 月</option>
                <option value="1">2 月</option>
                <option value="2">3 月</option>
                <option value="3">4 月</option>
                <option value="4">5 月</option>
                <option value="5">6 月</option>
                <option value="6">7 月</option>
                <option value="7">8 月</option>
                <option value="8">9 月</option>
                <option value="9">10 月</option>
                <option value="10">11 月</option>
                <option value="11">12 月</option>
            </select>
        </div>
        <div class="report-buttons">
            <button id="downloadBtn">月次レポートをダウンロード (CSV)</button>
            <button id="clearBtn">シートクリア</button>
        </div>
        
        <form id="changePasswordForm">
            <h3>パスワード変更</h3>
            <label for="newPassword">新しいパスワード:</label>
            <input type="password" id="newPassword" required>
            <button type="submit">変更</button>
        </form>
        
        <button id="logoutBtn">ログアウト</button>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            console.log('DOM loaded');

            // サービスワーカーを登録
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js')
                    .then(registration => console.log('Service Worker registered'))
                    .catch(error => console.log('Service Worker registration failed'));
            }
            
            // 要素を取得
            const navLoginBtn = document.getElementById('navLoginBtn');
            const navSignupBtn = document.getElementById('navSignupBtn');
            const backToLogin = document.getElementById('backToLogin');
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const attendanceForm = document.getElementById('attendanceForm');
            const userAttendanceForm = document.getElementById('userAttendanceForm');
            const changePasswordForm = document.getElementById('changePasswordForm');
            const employeeLogBody = document.getElementById('employeeLogBody');
            const logBody = document.getElementById('logBody');
            const employeeDownloadBtn = document.getElementById('employeeDownloadBtn');
            const downloadBtn = document.getElementById('downloadBtn');
            const clearBtn = document.getElementById('clearBtn');
            const logoutBtns = document.querySelectorAll('#logoutBtn');
            const employeeYear = document.getElementById('employeeYear');
            const employeeMonth = document.getElementById('employeeMonth');
            const adminYear = document.getElementById('adminYear');
            const adminMonth = document.getElementById('adminMonth');
            
            // 追加：セクションの要素を取得 (ここが重要)
            const loginSection = document.getElementById('loginSection');
            const signupSection = document.getElementById('signupSection');

            console.log('navLoginBtn:', navLoginBtn);
            console.log('navSignupBtn:', navSignupBtn);

            // 年オプションを動的に追加
            const currentYear = new Date().getFullYear();
            for (let year = currentYear - 5; year <= currentYear; year++) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year;
                employeeYear.appendChild(option);
                adminYear.appendChild(option.cloneNode(true));
            }
            employeeYear.value = currentYear;
            adminYear.value = currentYear;
            employeeMonth.value = new Date().getMonth();
            adminMonth.value = new Date().getMonth();

            // 変数初期化
            let attendanceLog = JSON.parse(localStorage.getItem('attendanceLog')) || [];
            let users = JSON.parse(localStorage.getItem('users')) || [];
            
            // 初期管理者ユーザーを追加
            if (users.length === 0) {
                users.push({ id: 'nishiyoshi', password: 'nishiyoshi0203', role: 'admin' });
                localStorage.setItem('users', JSON.stringify(users));
            }
            
            let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;

            // UI 切り替え関数
            function toggleUI() {
                if (currentUser) {
                    // ログイン中
                    loginSection.style.display = 'none';
                    signupSection.style.display = 'none';
                    document.getElementById('userSection').style.display = currentUser.role === 'user' ? 'block' : 'none';
                    document.getElementById('employeeSection').style.display = currentUser.role === 'employee' ? 'block' : 'none';
                    document.getElementById('adminSection').style.display = currentUser.role === 'admin' ? 'block' : 'none';
                    
                    if (currentUser.role === 'employee') loadEmployeeLog();
                    if (currentUser.role === 'admin') loadLog();
                } else {
                    // ログアウト時
                    loginSection.style.display = 'block';
                    signupSection.style.display = 'none';
                    loginForm.style.display = 'none';
                    attendanceForm.style.display = 'block';
                }
            }

            toggleUI();

            // ナビゲーションバーのボタン
            if (navLoginBtn) {
                navLoginBtn.addEventListener('click', () => {
                    console.log('Login button clicked');
                    // ログインセクションを表示し、サインアップセクションを隠す
                    loginSection.style.display = 'block';
                    signupSection.style.display = 'none';
                    // ログインフォームを表示
                    loginForm.style.display = 'block';
                    // チェックインフォームを隠す
                    attendanceForm.style.display = 'none';
                });
            }

            if (navSignupBtn) {
                navSignupBtn.addEventListener('click', () => {
                    console.log('Signup button clicked');
                    // サインアップセクションを表示し、ログインセクションを隠す
                    signupSection.style.display = 'block';
                    loginSection.style.display = 'none';
                });
            }

            if (backToLogin) {
                backToLogin.addEventListener('click', () => {
                    console.log('Back to login clicked');
                    // サインアップセクションを隠し、ログインセクションを表示
                    signupSection.style.display = 'none';
                    loginSection.style.display = 'block';
                    // ログインフォームを表示
                    loginForm.style.display = 'block';
                    // チェックインフォームを隠す
                    attendanceForm.style.display = 'none';
                });
            }

            // サインアップ処理
            if (signupForm) {
                signupForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    console.log('Signup form submitted');
                    const id = document.getElementById('signupId').value.trim();
                    const password = document.getElementById('signupPassword').value;
                    const role = document.getElementById('role').value;

                    console.log('Signup attempt:', { id, password, role });

                    if (users.find(user => user.id === id)) {
                        alert('この ID は既に使用されています。');
                        return;
                    }
                    if (password.length < 6) {
                        alert('パスワードは 6 文字以上で入力してください。');
                        return;
                    }

                    let assignedRole = role;
                    if (role === 'admin') {
                        if (id !== 'nishiyoshi' || password !== 'nishiyoshi0203') {
                            alert('管理者ロールは特定の ID とパスワードでのみ可能です。従業員としてサインアップします。');
                            assignedRole = 'employee';
                        }
                    }

                    users.push({ id, password, role: assignedRole });
                    localStorage.setItem('users', JSON.stringify(users));
                    alert(`サインアップが完了しました。ロール：${assignedRole}。ログインしてください。`);
                    console.log('Signup successful:', { id, role: assignedRole });
                    signupForm.reset();
                    signupSection.style.display = 'none';
                    loginSection.style.display = 'block';
                    loginForm.style.display = 'block';
                    attendanceForm.style.display = 'none';
                });
            }
            // ログイン処理
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const id = document.getElementById('loginId').value.trim();
                const password = document.getElementById('loginPassword').value;
                const user = users.find(u => u.id === id && u.password === password);

                if (user) {
                    currentUser = user;
                    sessionStorage.setItem('currentUser', JSON.stringify(user));
                    alert(`${user.role}としてログインしました`);
                    toggleUI();
                    loginForm.reset();
                } else {
                    alert('IDまたはパスワードが間違っています。');
                }
            });

            // パスワード変更処理
            if (changePasswordForm) {
                changePasswordForm.addEventListener('submit', (e) => {
                    e.preventDefault();
                    const newPassword = document.getElementById('newPassword').value;
                    if (newPassword.length < 6) {
                        alert('パスワードは6文字以上で入力してください。');
                        return;
                    }
                    currentUser.password = newPassword;
                    const index = users.findIndex(u => u.id === currentUser.id);
                    users[index] = currentUser;
                    localStorage.setItem('users', JSON.stringify(users));
                    alert('パスワードが変更されました。');
                    changePasswordForm.reset();
                });
            }

            // ログアウト処理
            logoutBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentUser = null;
                    sessionStorage.removeItem('currentUser');
                    alert('ログアウトしました');
                    toggleUI();
                });
            });

            // 従業員用ログを読み込む
            function loadEmployeeLog() {
                employeeLogBody.innerHTML = '';
                const employeeEntries = attendanceLog.filter(entry => entry.name === currentUser.id);
                employeeEntries.forEach(entry => {
                    const locationText = entry.locationName || 'N/A';
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${entry.action}</td><td>${entry.timestamp}</td><td>${locationText}</td>`;
                    employeeLogBody.appendChild(row);
                });
            }

            // 管理者用ログを読み込む
            function loadLog() {
                logBody.innerHTML = '';
                attendanceLog.forEach(entry => {
                    const locationText = entry.locationName || 'N/A';
                    const row = document.createElement('tr');
                    row.innerHTML = `<td>${entry.name}</td><td>${entry.action}</td><td>${entry.timestamp}</td><td>${locationText}</td>`;
                    logBody.appendChild(row);
                });
            }

            // 緯度経度から場所名を取得する関数
            async function getLocationName(lat, lng) {
                try {
                    const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                    const data = await response.json();
                    return data.display_name || '不明な場所';
                } catch (error) {
                    console.error('場所名の取得エラー:', error);
                    return '場所利用不可';
                }
            }
             // フォーム送信を処理
            if (attendanceForm) {
                attendanceForm.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    const name = document.getElementById('name').value;
                    const action = e.submitter.id === 'checkInBtn' ? 'チェックイン' : 'チェックアウト';
                    const timestamp = new Date().toLocaleString('ja-JP');
                    const currentDate = new Date().toDateString();

                    const existingEntry = attendanceLog.find(entry => {
                        const entryDate = new Date(entry.timestamp).toDateString();
                        return entry.name === name && entryDate === currentDate && entry.action === action;
                    });

                    if (existingEntry) {
                        alert(`同じ日に${action}は一度しかできません。`);
                        return;
                    }

                    if (navigator.geolocation) {
                        navigator.geolocation.getCurrentPosition(
                            async (position) => {
                                const lat = position.coords.latitude;
                                const lng = position.coords.longitude;
                                const locationName = await getLocationName(lat, lng);
                                const entry = { name, action, timestamp, locationName };
                                attendanceLog.push(entry);
                                localStorage.setItem('attendanceLog', JSON.stringify(attendanceLog));
                                if (currentUser && currentUser.id === name) loadEmployeeLog();
                                if (currentUser && currentUser.role === 'admin') loadLog();
                                attendanceForm.reset();
                            },
                            (error) => {
                                alert('場所へのアクセスが拒否されたか利用できません。場所なしでエントリを保存します。');
                                const entry = { name, action, timestamp, locationName: 'N/A' };
                                attendanceLog.push(entry);
                                localStorage.setItem('attendanceLog', JSON.stringify(attendanceLog));
                                if (currentUser && currentUser.id === name) loadEmployeeLog();
                                if (currentUser && currentUser.role === 'admin') loadLog();
                                attendanceForm.reset();
                            }
                        );
                    } else {
                        alert('このブラウザはジオロケーションをサポートしていません。場所なしでエントリを保存します。');
                        const entry = { name, action, timestamp, locationName: 'N/A' };
                        attendanceLog.push(entry);
                        localStorage.setItem('attendanceLog', JSON.stringify(attendanceLog));
                        if (currentUser && currentUser.id === name) loadEmployeeLog();
                        if (currentUser && currentUser.role === 'admin') loadLog();
                        attendanceForm.reset();
                    }
                });
            }

            // 各従業員の総労働時間を計算する関数
            function calculateTotalHours(entries) {
                const employeeHours = {};
                const grouped = entries.reduce((acc, entry) => {
                    if (!acc[entry.name]) acc[entry.name] = [];
                    acc[entry.name].push(entry);
                    return acc;
                }, {});

                for (const name in grouped) {
                    const empEntries = grouped[name].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                    let totalMs = 0;
                    let checkInTime = null;

                    empEntries.forEach(entry => {
                        if (entry.action === 'チェックイン') {
                            checkInTime = new Date(entry.timestamp);
                        } else if (entry.action === 'チェックアウト' && checkInTime) {
                            const checkOutTime = new Date(entry.timestamp);
                            totalMs += checkOutTime - checkInTime;
                            checkInTime = null;
                        }
                    });

                    employeeHours[name] = (totalMs / (1000 * 60 * 60)).toFixed(2);
                }

                return employeeHours;
            }

            // 従業員用月次レポートをCSVでダウンロード
            if (employeeDownloadBtn) {
                employeeDownloadBtn.addEventListener('click', () => {
                    if (!currentUser || currentUser.role !== 'employee') return;
                    const selectedYear = parseInt(employeeYear.value);
                    const selectedMonth = parseInt(employeeMonth.value);

                    const employeeMonthlyEntries = attendanceLog.filter(entry => {
                        const entryDate = new Date(entry.timestamp);
                        return entry.name === currentUser.id && entryDate.getMonth() === selectedMonth && entryDate.getFullYear() === selectedYear;
                    });

                    if (employeeMonthlyEntries.length === 0) {
                        alert('選択した月にエントリが見つかりません。');
                        return;
                    }

                    const totalHours = calculateTotalHours(employeeMonthlyEntries);

                    let csvContent = '\ufeff';
                    csvContent += `${currentUser.id}\n`;
                    csvContent += 'アクション,タイムスタンプ,場所\n';
                    employeeMonthlyEntries.forEach(entry => {
                        const locationText = entry.locationName || 'N/A';
                        csvContent += `${entry.action},${entry.timestamp},"${locationText}"\n`;
                    });
                    csvContent += `総労働時間,${totalHours[currentUser.id]} 時間\n`;

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `${currentUser.id}_月次レポート_${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }

            // 月次レポートをCSVでダウンロード (管理者専用)
            if (downloadBtn) {
                downloadBtn.addEventListener('click', () => {
                    if (!currentUser || currentUser.role !== 'admin') return;
                    const selectedYear = parseInt(adminYear.value);
                    const selectedMonth = parseInt(adminMonth.value);

                    const monthlyEntries = attendanceLog.filter(entry => {
                        const entryDate = new Date(entry.timestamp);
                        return entryDate.getMonth() === selectedMonth && entryDate.getFullYear() === selectedYear;
                    });

                    if (monthlyEntries.length === 0) {
                        alert('選択した月にエントリが見つかりません。');
                        return;
                    }

                    const totalHours = calculateTotalHours(monthlyEntries);

                    const groupedByEmployee = monthlyEntries.reduce((acc, entry) => {
                        if (!acc[entry.name]) acc[entry.name] = [];
                        acc[entry.name].push(entry);
                        return acc;
                    }, {});

                    let csvContent = '\ufeff';

                    for (const name in groupedByEmployee) {
                        csvContent += `${name}\n`;
                        csvContent += 'アクション,タイムスタンプ,場所\n';
                        groupedByEmployee[name].forEach(entry => {
                            const locationText = entry.locationName || 'N/A';
                            csvContent += `${entry.action},${entry.timestamp},"${locationText}"\n`;
                        });
                        csvContent += `総労働時間,${totalHours[name]} 時間\n`;
                        csvContent += '\n';
                    }

                    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `Nishiyoshi_出勤_月次レポート_${selectedYear}-${String(selectedMonth + 1).padStart(2, '0')}.csv`;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                });
            }

            // シートクリアボタン (管理者専用)
            if (clearBtn) {
                clearBtn.addEventListener('click', () => {
                    if (!currentUser || currentUser.role !== 'admin') return;
                    if (confirm('すべての出勤ログをクリアしますか？この操作は元に戻せません。')) {
                        attendanceLog = [];
                        localStorage.removeItem('attendanceLog');
                        loadEmployeeLog();
                        loadLog();
                        alert('ログがクリアされました。');
                    }
                });
            }
        });
</script>
</body>
</html>
