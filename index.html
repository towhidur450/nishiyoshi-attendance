<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nishiyoshi 出勤管理システム</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f4; }
        h1 { color: #333; text-align: center; }
        form { max-width: 400px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        label, input, button { display: block; width: 100%; margin-bottom: 10px; }
        button { background: #4CAF50; color: white; border: none; padding: 10px; cursor: pointer; }
        button:hover { background: #45a049; }
        .action-buttons { display: flex; justify-content: space-between; }
        .action-buttons button { width: 48%; }
        .report-buttons { display: flex; justify-content: space-between; max-width: 400px; margin: 20px auto; }
        .report-buttons button { width: 48%; }
        table { width: 100%; margin-top: 20px; border-collapse: collapse; background: white; }
        th, td { padding: 10px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background: #f2f2f2; }
        #loginSection { display: block; }
        #userSection { display: none; }
        #adminSection { display: none; }
        #logoutBtn { max-width: 200px; margin: 20px auto; display: block; background: #f44336; }
        #logoutBtn:hover { background: #d32f2f; }
        #changePasswordForm { max-width: 400px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <h1>Nishiyoshi 出勤管理システム</h1>
    
    <!-- ログインセクション -->
    <div id="loginSection">
        <form id="loginForm">
            <label for="password">管理者パスワード:</label>
            <input type="password" id="password" required>
            <button type="submit">ログイン</button>
        </form>
    </div>
    
    <!-- 一般ユーザーセクション (チェックイン/チェックアウトのみ) -->
    <div id="userSection">
        <form id="attendanceForm">
            <label for="name">従業員名:</label>
            <input type="text" id="name" required>
            
            <div class="action-buttons">
                <button type="submit" id="checkInBtn">チェックイン</button>
                <button type="submit" id="checkOutBtn">チェックアウト</button>
            </div>
        </form>
        
        <button id="logoutBtn">ログアウト</button>
    </div>
    
    <!-- 管理者セクション (ログ + レポート/ダウンロード/クリア + パスワード変更) -->
    <div id="adminSection">
        <h2>出勤ログ</h2>
        <table id="logTable">
            <thead>
                <tr>
                    <th>名前</th>
                    <th>アクション</th>
                    <th>タイムスタンプ</th>
                    <th>場所</th>
                </tr>
            </thead>
            <tbody id="logBody">
                <!-- エントリがここに追加されます -->
            </tbody>
        </table>
        
        <div class="report-buttons">
            <button id="downloadBtn">月次レポートをダウンロード (CSV)</button>
            <button id="clearBtn">シートクリア</button>
        </div>
        
        <form id="changePasswordForm">
            <h3>パスワード変更</h3>
            <label for="newPassword">新しいパスワード:</label>
            <input type="password" id="newPassword" required>
            <button type="submit">変更</button>
        </form>
        
        <button id="logoutBtn">ログアウト</button>
    </div>

    <script>
        // サービスワーカーを登録 (PWA用)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(registration => console.log('Service Worker registered'))
                .catch(error => console.log('Service Worker registration failed'));
        }

        const loginForm = document.getElementById('loginForm');
        const attendanceForm = document.getElementById('attendanceForm');
        const changePasswordForm = document.getElementById('changePasswordForm');
        const logBody = document.getElementById('logBody');
        const downloadBtn = document.getElementById('downloadBtn');
        const clearBtn = document.getElementById('clearBtn');
        const logoutBtns = document.querySelectorAll('#logoutBtn');
        const checkInBtn = document.getElementById('checkInBtn');
        const checkOutBtn = document.getElementById('checkOutBtn');
        let attendanceLog = JSON.parse(localStorage.getItem('attendanceLog')) || [];
        let adminPassword = localStorage.getItem('adminPassword') || 'admin123'; // デフォルトパスワード
        let isAdmin = sessionStorage.getItem('isAdmin') === 'true'; // セッションでログイン状態を維持

        // UIを切り替え
        function toggleUI() {
            document.getElementById('loginSection').style.display = isAdmin ? 'none' : 'block';
            document.getElementById('userSection').style.display = isAdmin ? 'none' : 'block';
            document.getElementById('adminSection').style.display = isAdmin ? 'block' : 'none';
            if (isAdmin) loadLog();
        }

        // 初期ロード時にUIをチェック
        toggleUI();

        // ログイン処理
        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const password = document.getElementById('password').value;
            if (password === adminPassword) {
                isAdmin = true;
                sessionStorage.setItem('isAdmin', 'true');
                toggleUI();
                loginForm.reset();
            } else {
                alert('パスワードが間違っています。');
            }
        });

        // パスワード変更処理
        changePasswordForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const newPassword = document.getElementById('newPassword').value;
            if (newPassword.length < 6) {
                alert('パスワードは6文字以上で入力してください。');
                return;
            }
            adminPassword = newPassword;
            localStorage.setItem('adminPassword', adminPassword);
            alert('パスワードが変更されました。');
            changePasswordForm.reset();
        });

        // ログアウト処理
        logoutBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                isAdmin = false;
                sessionStorage.removeItem('isAdmin');
                toggleUI();
            });
        });

        // 管理者用ログを読み込む
        function loadLog() {
            logBody.innerHTML = '';
            attendanceLog.forEach(entry => {
                const locationText = entry.locationName || 'N/A';
                const row = document.createElement('tr');
                row.innerHTML = `<td>${entry.name}</td><td>${entry.action}</td><td>${entry.timestamp}</td><td>${locationText}</td>`;
                logBody.appendChild(row);
            });
        }

        // 緯度経度から場所名を取得する関数 (Nominatimを使用)
        async function getLocationName(lat, lng) {
            try {
                const response = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
                const data = await response.json();
                return data.display_name || '不明な場所';
            } catch (error) {
                console.error('場所名の取得エラー:', error);
                return '場所利用不可';
            }
        }

        // フォーム送信を処理 (ジオロケーションと逆ジオコーディング付き)
        attendanceForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const action = e.submitter.id === 'checkInBtn' ? 'チェックイン' : 'チェックアウト';
            const timestamp = new Date().toLocaleString('ja-JP');
            const currentDate = new Date().toDateString(); // 現在の日付 (YYYY-MM-DD形式)

            // 同じ従業員、同じ日、同じアクションのエントリがあるかチェック
            const existingEntry = attendanceLog.find(entry => {
                const entryDate = new Date(entry.timestamp).toDateString();
                return entry.name === name && entryDate === currentDate && entry.action === action;
            });

            if (existingEntry) {
                alert(`同じ日に${action}は一度しかできません。`);
                return; // エントリを保存しない
            }

            // ジオロケーションをリクエスト
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (position) => {
                        const lat = position.coords.latitude;
                        const lng = position.coords.longitude;
                        const locationName = await getLocationName(lat, lng);
                        const entry = { name, action, timestamp, locationName };
                        attendanceLog.push(entry);
                        localStorage.setItem('attendanceLog', JSON.stringify(attendanceLog));
                        if (isAdmin) loadLog();
                        attendanceForm.reset();
                    },
                    (error) => {
                        alert('場所へのアクセスが拒否されたか利用できません。場所なしでエントリを保存します。');
                        const entry = { name, action, timestamp, locationName: 'N/A' };
                        attendanceLog.push(entry);
                        localStorage.setItem('attendanceLog', JSON.stringify(attendanceLog));
                        if (isAdmin) loadLog();
                        attendanceForm.reset();
                    }
                );
            } else {
                alert('このブラウザはジオロケーションをサポートしていません。場所なしでエントリを保存します。');
                const entry = { name, action, timestamp, locationName: 'N/A' };
                attendanceLog.push(entry);
                localStorage.setItem('attendanceLog', JSON.stringify(attendanceLog));
                if (isAdmin) loadLog();
                attendanceForm.reset();
            }
        });

        // 各従業員の総労働時間を計算する関数
        function calculateTotalHours(entries) {
            const employeeHours = {};
            const grouped = entries.reduce((acc, entry) => {
                if (!acc[entry.name]) acc[entry.name] = [];
                acc[entry.name].push(entry);
                return acc;
            }, {});

            for (const name in grouped) {
                const empEntries = grouped[name].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
                let totalMs = 0;
                let checkInTime = null;

                empEntries.forEach(entry => {
                    if (entry.action === 'チェックイン') {
                        checkInTime = new Date(entry.timestamp);
                    } else if (entry.action === 'チェックアウト' && checkInTime) {
                        const checkOutTime = new Date(entry.timestamp);
                        totalMs += checkOutTime - checkInTime;
                        checkInTime = null; // 次回ペア用にリセット
                    }
                });

                employeeHours[name] = (totalMs / (1000 * 60 * 60)).toFixed(2); // 時間に変換
            }

            return employeeHours;
        }

        // 月次レポートをCSVでダウンロード (各従業員ごとに別テーブル) - 管理者専用
        downloadBtn.addEventListener('click', () => {
            if (!isAdmin) return; // 管理者チェック
            const now = new Date();
            const currentMonth = now.getMonth();
            const currentYear = now.getFullYear();
            
            // 当月のエントリをフィルタリング
            const monthlyEntries = attendanceLog.filter(entry => {
                const entryDate = new Date(entry.timestamp);
                return entryDate.getMonth() === currentMonth && entryDate.getFullYear() === currentYear;
            });
            
            if (monthlyEntries.length === 0) {
                alert('当月にエントリが見つかりません。');
                return;
            }
            
            // 総時間を計算
            const totalHours = calculateTotalHours(monthlyEntries);
            
            // 従業員ごとにグループ化
            const groupedByEmployee = monthlyEntries.reduce((acc, entry) => {
                if (!acc[entry.name]) acc[entry.name] = [];
                acc[entry.name].push(entry);
                return acc;
            }, {});
            
            // CSVコンテンツを作成 (UTF-8 BOMを追加)
            let csvContent = '\ufeff';
            
            for (const name in groupedByEmployee) {
                // 従業員名をヘッダーとして追加
                csvContent += `${name}\n`;
                // テーブルヘッダー
                csvContent += 'アクション,タイムスタンプ,場所\n';
                // エントリを追加
                groupedByEmployee[name].forEach(entry => {
                    const locationText = entry.locationName || 'N/A';
                    csvContent += `${entry.action},${entry.timestamp},"${locationText}"\n`;
                });
                // 総時間を追加
                csvContent += `総労働時間,${totalHours[name]} 時間\n`;
                // 空白行で区切る
                csvContent += '\n';
            }
            
            // ファイルをダウンロード
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Nishiyoshi_出勤_月次レポート_${currentYear}-${String(currentMonth + 1).padStart(2, '0')}.csv`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        });

        // シートクリアボタン - 管理者専用
        clearBtn.addEventListener('click', () => {
            if (!isAdmin) return; // 管理者チェック
            if (confirm('すべての出勤ログをクリアしますか？この操作は元に戻せません。')) {
                attendanceLog = [];
                localStorage.removeItem('attendanceLog');
                loadLog();
                alert('ログがクリアされました。');
            }
        });
    </script>
</body>
</html>
